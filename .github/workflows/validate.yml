name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest segno

      - name: Run unit tests
        run: python -m pytest -v

      - name: Regenerate profiles
        run: python scripts/generate_profiles.py

      - name: Regenerate QR codes
        run: python scripts/make_qr.py

      - name: Fail if the committed profiles or QR codes drifted from the catalogue
        run: |
          if [ -n "$(git status --porcelain -- docs/profiles docs/qr)" ]; then
            echo "::error::docs/profiles or docs/qr is out of date. Run: python scripts/generate_profiles.py && python scripts/make_qr.py"
            git status --porcelain -- docs/profiles docs/qr
            exit 1
          fi

      - name: Validate profile structure
        run: python scripts/validate_profiles.py
