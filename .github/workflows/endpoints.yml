name: endpoints

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Probe every provider endpoint
        run: python scripts/check_endpoints.py
