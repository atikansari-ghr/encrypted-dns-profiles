<svg viewBox="0 0 860 740" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title>Illustrative mockup of checking a DNS resolver on dnsleaktest.com: tap Standard test, then read the result</title>
<desc>Illustrative mockup, not a real screenshot. Left: the dnsleaktest.com landing page with the Standard test button. Right: a passing result. Uses a documentation-only example IP address and no real user data.</desc>

<defs>
  <filter id="dnsverify-blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="42"/>
  </filter>
  <linearGradient id="dnsverify-panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.68"/>
  </linearGradient>
  <filter id="dnsverify-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1C1C1E" flood-opacity="0.14"/>
  </filter>
</defs>

<rect x="0" y="0" width="860" height="740" fill="#F4F5F7"/>
<circle cx="80" cy="80" r="140" fill="#2FA84F" opacity="0.26" filter="url(#dnsverify-blur)"/>
<circle cx="780" cy="70" r="150" fill="#2E5AAC" opacity="0.24" filter="url(#dnsverify-blur)"/>
<circle cx="430" cy="370" r="120" fill="#F6821F" opacity="0.18" filter="url(#dnsverify-blur)"/>
<circle cx="120" cy="660" r="140" fill="#7C4DFF" opacity="0.22" filter="url(#dnsverify-blur)"/>
<circle cx="760" cy="670" r="140" fill="#00B8A9" opacity="0.22" filter="url(#dnsverify-blur)"/>
<rect x="8" y="8" width="404" height="704" rx="26" fill="url(#dnsverify-panel)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#dnsverify-shadow)"/>
<rect x="448" y="8" width="404" height="704" rx="26" fill="url(#dnsverify-panel)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#dnsverify-shadow)"/>

<!-- ===== Panel 1: landing page, tap Standard test ===== -->
<rect x="20" y="20" width="360" height="660" rx="34" fill="#0B0B0C"/>
<rect x="30" y="30" width="340" height="640" rx="26" fill="#FFFFFF"/>

<text x="50" y="56" font-size="12" font-weight="600" fill="#1C1C1E">2:45</text>
<g fill="#1C1C1E">
  <rect x="300" y="49" width="3" height="6" rx="1"/>
  <rect x="306" y="46" width="3" height="9" rx="1"/>
  <rect x="312" y="43" width="3" height="12" rx="1"/>
  <rect x="318" y="40" width="3" height="15" rx="1"/>
</g>
<rect x="330" y="45" width="20" height="10" rx="2.5" fill="none" stroke="#1C1C1E" stroke-width="1.3"/>
<rect x="332" y="47" width="14" height="6" rx="1" fill="#1C1C1E"/>

<rect x="30" y="66" width="340" height="46" fill="#E4E1DA"/>
<text x="50" y="94" font-size="14" font-weight="700" fill="#1C1C1E">dnsleaktest.com</text>
<g stroke="#5F6368" stroke-width="1.6" stroke-linecap="round">
  <line x1="342" y1="84" x2="356" y2="84"/>
  <line x1="342" y1="90" x2="356" y2="90"/>
  <line x1="342" y1="96" x2="356" y2="96"/>
</g>

<text x="200" y="152" font-size="16" font-weight="700" fill="#1C1C1E" text-anchor="middle">Hello 203.0.113.42</text>
<text x="200" y="172" font-size="12" font-style="italic" fill="#8A8A8E" text-anchor="middle">from your location</text>

<rect x="50" y="204" width="300" height="46" rx="9" fill="#2E5AAC"/>
<text x="200" y="232" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Standard test</text>

<rect x="50" y="262" width="300" height="46" rx="9" fill="#FFFFFF" stroke="#2E5AAC" stroke-width="1.5"/>
<text x="200" y="290" font-size="14" font-weight="600" fill="#2E5AAC" text-anchor="middle">Extended test</text>

<text x="200" y="324" font-size="11.5" fill="#5F6368" text-anchor="middle" text-decoration="underline">What's the difference?</text>

<!-- tap indicator on the primary button -->
<circle cx="322" cy="227" r="14" fill="none" stroke="#F6821F" stroke-width="2"/>
<circle cx="322" cy="227" r="4" fill="#F6821F"/>

<rect x="30" y="632" width="340" height="38" fill="#EFEFF2"/>
<circle cx="52" cy="651" r="9" fill="none" stroke="#8A8A8E" stroke-width="1.4"/>
<path d="M55 648 l-4 3 l4 3" fill="none" stroke="#8A8A8E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="641" width="220" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8DC" stroke-width="1"/>
<text x="200" y="655" font-size="11" fill="#3C3C43" text-anchor="middle">dnsleaktest.com</text>
<circle cx="348" cy="651" r="9" fill="none" stroke="#8A8A8E" stroke-width="1.4"/>

<text x="200" y="712" font-size="12.5" font-weight="700" fill="#1C1C1E" text-anchor="middle">1. Visit the site, tap Standard test</text>

<!-- ===== arrow between panels ===== -->
<path d="M392 350 h48" stroke="#8A8A8E" stroke-width="2.5" stroke-linecap="round"/>
<path d="M424 338 l16 12 l-16 12" fill="none" stroke="#8A8A8E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

<!-- ===== Panel 2: result ===== -->
<rect x="460" y="20" width="360" height="660" rx="34" fill="#0B0B0C"/>
<rect x="470" y="30" width="340" height="640" rx="26" fill="#FFFFFF"/>

<text x="490" y="56" font-size="12" font-weight="600" fill="#1C1C1E">2:45</text>
<g fill="#1C1C1E">
  <rect x="740" y="49" width="3" height="6" rx="1"/>
  <rect x="746" y="46" width="3" height="9" rx="1"/>
  <rect x="752" y="43" width="3" height="12" rx="1"/>
  <rect x="758" y="40" width="3" height="15" rx="1"/>
</g>
<rect x="770" y="45" width="20" height="10" rx="2.5" fill="none" stroke="#1C1C1E" stroke-width="1.3"/>
<rect x="772" y="47" width="14" height="6" rx="1" fill="#1C1C1E"/>

<rect x="470" y="66" width="340" height="46" fill="#E4E1DA"/>
<text x="490" y="94" font-size="14" font-weight="700" fill="#1C1C1E">dnsleaktest.com</text>
<g stroke="#5F6368" stroke-width="1.6" stroke-linecap="round">
  <line x1="782" y1="84" x2="796" y2="84"/>
  <line x1="782" y1="90" x2="796" y2="90"/>
  <line x1="782" y1="96" x2="796" y2="96"/>
</g>

<text x="490" y="146" font-size="16" font-weight="700" fill="#1C1C1E">Your public IP: 203.0.113.42</text>
<text x="490" y="168" font-size="13" fill="#5F6368">Test complete</text>

<rect x="490" y="188" width="300" height="76" rx="8" fill="#F7F7F9" stroke="#E1E1E6" stroke-width="1"/>
<text x="502" y="208" font-size="10.5" font-weight="700" fill="#6E6E73">IP</text>
<text x="590" y="208" font-size="10.5" font-weight="700" fill="#6E6E73">HOSTNAME</text>
<line x1="490" y1="216" x2="790" y2="216" stroke="#E1E1E6" stroke-width="1"/>
<text x="502" y="240" font-size="12" fill="#1C1C1E">94.140.14.14</text>
<text x="590" y="240" font-size="12" fill="#1C1C1E">dns.adguard&#8288;-dns.com</text>
<text x="502" y="256" font-size="10.5" fill="#8A8A8E">Example row &#8212; yours will show the hostname of the profile you installed.</text>

<rect x="490" y="280" width="300" height="70" rx="10" fill="#EAF7EE" stroke="#BFE6C8" stroke-width="1"/>
<circle cx="512" cy="308" r="13" fill="#2FA84F"/>
<path d="M505 308 l5 5 l10 -11" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="532" y="304" font-size="12" font-weight="700" fill="#1C1C1E">Hostname matches your profile</text>
<text x="532" y="320" font-size="10.5" fill="#3C3C43">Your DNS queries are going</text>
<text x="532" y="333" font-size="10.5" fill="#3C3C43">where you chose.</text>

<rect x="490" y="362" width="300" height="70" rx="10" fill="#FDECEC" stroke="#F3C6C6" stroke-width="1"/>
<circle cx="512" cy="390" r="13" fill="#D93025"/>
<line x1="506" y1="384" x2="518" y2="396" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
<line x1="518" y1="384" x2="506" y2="396" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
<text x="532" y="386" font-size="12" font-weight="700" fill="#1C1C1E">See your ISP's name instead?</text>
<text x="532" y="402" font-size="10.5" fill="#3C3C43">Profile isn't active &#8212; re-check</text>
<text x="532" y="415" font-size="10.5" fill="#3C3C43">Settings and try again.</text>

<text x="490" y="452" font-size="10.5" fill="#8A8A8E">Independent third-party site &#8212; not part of this project or any DNS provider above.</text>

<rect x="470" y="632" width="340" height="38" fill="#EFEFF2"/>
<circle cx="492" cy="651" r="9" fill="none" stroke="#8A8A8E" stroke-width="1.4"/>
<path d="M495 648 l-4 3 l4 3" fill="none" stroke="#8A8A8E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="530" y="641" width="220" height="20" rx="10" fill="#FFFFFF" stroke="#D8D8DC" stroke-width="1"/>
<text x="640" y="655" font-size="11" fill="#3C3C43" text-anchor="middle">dnsleaktest.com</text>
<circle cx="788" cy="651" r="9" fill="none" stroke="#8A8A8E" stroke-width="1.4"/>

<text x="640" y="712" font-size="12.5" font-weight="700" fill="#1C1C1E" text-anchor="middle">2. Read the result</text>
</svg>
