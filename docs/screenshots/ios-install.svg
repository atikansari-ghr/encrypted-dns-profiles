<svg viewBox="0 0 980 660" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title>Installing an encrypted DNS profile on iOS: download in Safari, Settings shows Profile Downloaded, then review and install</title>
<desc>Illustrative mockup, not a real screenshot. Three iPhone screens showing the install flow for the unsigned AdGuard DNS - Ad Blocking (DoH) profile.</desc>

<defs>
  <filter id="ios-install-blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="42"/>
  </filter>
  <linearGradient id="ios-install-panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.68"/>
  </linearGradient>
  <filter id="ios-install-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1C1C1E" flood-opacity="0.14"/>
  </filter>
</defs>

<rect x="0" y="0" width="980" height="660" fill="#F4F5F7"/>
<circle cx="90" cy="70" r="140" fill="#2E5AAC" opacity="0.28" filter="url(#ios-install-blur)"/>
<circle cx="900" cy="80" r="150" fill="#F6821F" opacity="0.24" filter="url(#ios-install-blur)"/>
<circle cx="490" cy="600" r="170" fill="#7C4DFF" opacity="0.22" filter="url(#ios-install-blur)"/>
<circle cx="150" cy="580" r="130" fill="#2FA84F" opacity="0.22" filter="url(#ios-install-blur)"/>
<circle cx="850" cy="560" r="120" fill="#00B8A9" opacity="0.22" filter="url(#ios-install-blur)"/>
<rect x="8" y="8" width="964" height="640" rx="26" fill="url(#ios-install-panel)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#ios-install-shadow)"/>

<!-- Phone 1: Safari download -->
<g transform="translate(20,10)">
  <defs>
    <clipPath id="ios-install-clip-1"><rect x="6" y="6" width="288" height="588" rx="30"/></clipPath>
  </defs>
  <rect x="0" y="0" width="300" height="600" rx="36" fill="#1C1C1E"/>
  <rect x="6" y="6" width="288" height="588" rx="30" fill="#FFFFFF"/>
  <g clip-path="url(#ios-install-clip-1)">
    <text x="22" y="30" font-size="13" font-weight="600" fill="#1C1C1E">9:41</text>
    <rect x="230" y="16" width="4" height="13" fill="#1C1C1E"/>
    <rect x="236" y="20" width="4" height="9" fill="#1C1C1E"/>
    <rect x="242" y="18" width="4" height="11" fill="#1C1C1E"/>
    <rect x="252" y="18" width="22" height="11" rx="2.5" fill="none" stroke="#1C1C1E" stroke-width="1"/>
    <rect x="254" y="20" width="16" height="7" rx="1" fill="#1C1C1E"/>

    <rect x="6" y="40" width="288" height="34" fill="#F2F2F7"/>
    <rect x="38" y="49" width="224" height="22" rx="8" fill="#E4E4E8"/>
    <circle cx="52" cy="60" r="4" fill="none" stroke="#6E6E73" stroke-width="1.2"/>
    <text x="152" y="64" font-size="10" fill="#3C3C43" text-anchor="middle">atikansari-ghr.github.io</text>

    <text x="22" y="104" font-size="16" font-weight="700" fill="#1C1C1E">Encrypted DNS Profiles</text>
    <text x="22" y="124" font-size="11" fill="#6E6E73">AdGuard DNS - Ad Blocking (DoH)</text>
    <text x="22" y="146" font-size="10.5" fill="#6E6E73">Blocks ads and trackers on this device.</text>
    <text x="22" y="160" font-size="10.5" fill="#6E6E73">Tap below to install the profile.</text>

    <rect x="22" y="176" width="256" height="46" rx="10" fill="#007AFF"/>
    <text x="150" y="194" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Download AdGuard DNS -</text>
    <text x="150" y="209" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Ad Blocking (DoH)</text>
    <text x="22" y="240" font-size="9.5" fill="#8E8E93">.mobileconfig &#8226; unsigned profile</text>

    <rect x="6" y="356" width="288" height="238" rx="18" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <rect x="126" y="368" width="40" height="5" rx="2.5" fill="#D1D1D6"/>
    <text x="150" y="400" font-size="13.5" font-weight="700" fill="#1C1C1E" text-anchor="middle">Allow Downloads?</text>
    <text x="150" y="420" font-size="10" fill="#6E6E73" text-anchor="middle">&#8220;AdGuard DNS - Ad Blocking</text>
    <text x="150" y="433" font-size="10" fill="#6E6E73" text-anchor="middle">(DoH).mobileconfig&#8221;</text>
    <line x1="6" y1="452" x2="294" y2="452" stroke="#E5E5EA" stroke-width="1"/>
    <text x="80" y="475" font-size="14.5" fill="#007AFF" text-anchor="middle">Cancel</text>
    <line x1="150" y1="458" x2="150" y2="492" stroke="#E5E5EA" stroke-width="1"/>
    <text x="220" y="475" font-size="14.5" font-weight="700" fill="#007AFF" text-anchor="middle">Allow</text>
  </g>
</g>

<!-- Phone 2: Settings root, Profile Downloaded row -->
<g transform="translate(340,10)">
  <defs>
    <clipPath id="ios-install-clip-2"><rect x="6" y="6" width="288" height="588" rx="30"/></clipPath>
  </defs>
  <rect x="0" y="0" width="300" height="600" rx="36" fill="#1C1C1E"/>
  <rect x="6" y="6" width="288" height="588" rx="30" fill="#F2F2F7"/>
  <g clip-path="url(#ios-install-clip-2)">
    <text x="22" y="30" font-size="13" font-weight="600" fill="#1C1C1E">9:41</text>
    <rect x="230" y="16" width="4" height="13" fill="#1C1C1E"/>
    <rect x="236" y="20" width="4" height="9" fill="#1C1C1E"/>
    <rect x="242" y="18" width="4" height="11" fill="#1C1C1E"/>
    <rect x="252" y="18" width="22" height="11" rx="2.5" fill="none" stroke="#1C1C1E" stroke-width="1"/>
    <rect x="254" y="20" width="16" height="7" rx="1" fill="#1C1C1E"/>

    <text x="22" y="100" font-size="26" font-weight="700" fill="#1C1C1E">Settings</text>
    <rect x="22" y="112" width="256" height="28" rx="10" fill="#E4E4E8"/>
    <text x="38" y="131" font-size="11" fill="#8E8E93">Search</text>

    <rect x="22" y="152" width="256" height="46" rx="10" fill="#EAF2FF" stroke="#BBD8FF" stroke-width="1"/>
    <rect x="32" y="162" width="26" height="26" rx="7" fill="#007AFF"/>
    <rect x="41" y="169" width="8" height="10" rx="1" fill="#FFFFFF"/>
    <line x1="43" y1="172" x2="47" y2="172" stroke="#007AFF" stroke-width="0.8"/>
    <line x1="43" y1="175" x2="47" y2="175" stroke="#007AFF" stroke-width="0.8"/>
    <text x="66" y="180" font-size="14" font-weight="600" fill="#1C1C1E">Profile Downloaded</text>
    <text x="66" y="193" font-size="9.5" fill="#1E6FEA">Tap to review and install</text>
    <text x="264" y="182" font-size="15" fill="#7FB0FF">&#8250;</text>

    <rect x="22" y="212" width="256" height="176" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <rect x="34" y="222" width="24" height="24" rx="6" fill="#FF9500"/>
    <text x="70" y="240" font-size="13" fill="#1C1C1E">Airplane Mode</text>
    <text x="264" y="240" font-size="13" fill="#C6C6C8" text-anchor="middle">&#8250;</text>
    <line x1="70" y1="256" x2="270" y2="256" stroke="#E5E5EA" stroke-width="1"/>

    <rect x="34" y="266" width="24" height="24" rx="6" fill="#34C759"/>
    <text x="70" y="284" font-size="13" fill="#1C1C1E">Wi-Fi</text>
    <text x="264" y="284" font-size="13" fill="#C6C6C8" text-anchor="middle">&#8250;</text>
    <line x1="70" y1="300" x2="270" y2="300" stroke="#E5E5EA" stroke-width="1"/>

    <rect x="34" y="310" width="24" height="24" rx="6" fill="#007AFF"/>
    <text x="70" y="328" font-size="13" fill="#1C1C1E">Bluetooth</text>
    <text x="264" y="328" font-size="13" fill="#C6C6C8" text-anchor="middle">&#8250;</text>
    <line x1="70" y1="344" x2="270" y2="344" stroke="#E5E5EA" stroke-width="1"/>

    <rect x="34" y="354" width="24" height="24" rx="6" fill="#8E8E93"/>
    <text x="70" y="372" font-size="13" fill="#1C1C1E">General</text>
    <text x="264" y="372" font-size="13" fill="#C6C6C8" text-anchor="middle">&#8250;</text>
  </g>
</g>

<!-- Phone 3: Install Profile screen -->
<g transform="translate(660,10)">
  <defs>
    <clipPath id="ios-install-clip-3"><rect x="6" y="6" width="288" height="588" rx="30"/></clipPath>
  </defs>
  <rect x="0" y="0" width="300" height="600" rx="36" fill="#1C1C1E"/>
  <rect x="6" y="6" width="288" height="588" rx="30" fill="#F2F2F7"/>
  <g clip-path="url(#ios-install-clip-3)">
    <text x="22" y="30" font-size="13" font-weight="600" fill="#1C1C1E">9:41</text>
    <rect x="230" y="16" width="4" height="13" fill="#1C1C1E"/>
    <rect x="236" y="20" width="4" height="9" fill="#1C1C1E"/>
    <rect x="242" y="18" width="4" height="11" fill="#1C1C1E"/>
    <rect x="252" y="18" width="22" height="11" rx="2.5" fill="none" stroke="#1C1C1E" stroke-width="1"/>
    <rect x="254" y="20" width="16" height="7" rx="1" fill="#1C1C1E"/>

    <text x="26" y="100" font-size="14" fill="#007AFF">Cancel</text>
    <text x="150" y="97" font-size="10.5" fill="#8E8E93" text-anchor="middle">Profile</text>
    <text x="274" y="100" font-size="14" font-weight="600" fill="#007AFF" text-anchor="end">Install</text>

    <circle cx="150" cy="140" r="28" fill="#007AFF"/>
    <rect x="138" y="126" width="24" height="28" rx="3" fill="#FFFFFF"/>
    <line x1="142" y1="134" x2="158" y2="134" stroke="#007AFF" stroke-width="2"/>
    <line x1="142" y1="140" x2="158" y2="140" stroke="#007AFF" stroke-width="2"/>
    <line x1="142" y1="146" x2="153" y2="146" stroke="#007AFF" stroke-width="2"/>

    <text x="150" y="192" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="middle">AdGuard DNS -</text>
    <text x="150" y="210" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="middle">Ad Blocking (DoH)</text>
    <text x="150" y="230" font-size="12" font-weight="700" fill="#FF3B30" text-anchor="middle">Signed: Not Signed</text>

    <rect x="22" y="246" width="256" height="88" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <text x="34" y="274" font-size="12" fill="#1C1C1E">Signed</text>
    <text x="266" y="274" font-size="12" font-weight="700" fill="#FF3B30" text-anchor="end">Not Signed</text>
    <line x1="22" y1="290" x2="278" y2="290" stroke="#E5E5EA" stroke-width="1"/>
    <text x="34" y="318" font-size="12" fill="#1C1C1E">Contains</text>
    <text x="266" y="318" font-size="12" fill="#6E6E73" text-anchor="end">DNS Settings</text>

    <text x="22" y="354" font-size="10.5" font-weight="700" fill="#8E8E93">DESCRIPTION</text>
    <rect x="22" y="364" width="256" height="92" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <text x="34" y="384" font-size="10.5" fill="#1C1C1E">Blocks advertising and tracking</text>
    <text x="34" y="398" font-size="10.5" fill="#1C1C1E">domains across every app on this</text>
    <text x="34" y="412" font-size="10.5" fill="#1C1C1E">device. Operated by AdGuard</text>
    <text x="34" y="426" font-size="10.5" fill="#1C1C1E">Software Limited.</text>

    <rect x="22" y="468" width="256" height="46" rx="10" fill="#007AFF"/>
    <text x="150" y="497" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Install</text>
  </g>
</g>

<text x="170" y="632" font-size="13" font-weight="600" fill="#3C3C43" text-anchor="middle">1. Download in Safari</text>
<text x="490" y="632" font-size="13" font-weight="600" fill="#3C3C43" text-anchor="middle">2. Settings shows Profile Downloaded</text>
<text x="810" y="632" font-size="13" font-weight="600" fill="#3C3C43" text-anchor="middle">3. Review and install</text>
</svg>
