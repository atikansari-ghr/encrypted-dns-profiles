<!-- callout -->
<rect x="24" y="546" width="852" height="60" rx="10" fill="#EFF4FF" stroke="#D3E2FF" stroke-width="1"/>
<text x="44" y="572" font-size="13" font-weight="700" fill="#1C1C1E">Cloudflare's two profiles block malware only.</text>
<text x="44" y="590" font-size="12" fill="#3C3C43">They do not block ads or trackers &#8212; choose AdGuard, Mullvad or ControlD for that.</text>
