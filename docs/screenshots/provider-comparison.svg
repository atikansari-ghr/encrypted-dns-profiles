<svg viewBox="0 0 900 630" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
<title>Comparison of what each encrypted DNS profile blocks: ads, trackers, malware and adult content</title>
<desc>Illustrative graphic, not a screenshot. Nine provider profiles compared across four columns; the two Cloudflare rows are hollow in the Ads and Trackers columns because Cloudflare blocks malware only.</desc>
<rect x="0" y="0" width="900" height="630" fill="#FFFFFF"/>

<text x="24" y="36" font-size="18" font-weight="700" fill="#1C1C1E">What each profile blocks</text>
<text x="24" y="56" font-size="12" fill="#5F6368"><tspan fill="#2E5AAC">&#9679;</tspan> Blocks<tspan dx="14" fill="#B0B4BA">&#9675;</tspan> Does not block</text>

<!-- header -->
<text x="32" y="108" font-size="11.5" font-weight="700" fill="#6E6E73">PROFILE</text>
<text x="400" y="108" font-size="11.5" font-weight="700" fill="#6E6E73" text-anchor="middle">ADS</text>
<text x="536" y="108" font-size="11.5" font-weight="700" fill="#6E6E73" text-anchor="middle">TRACKERS</text>
<text x="672" y="108" font-size="11.5" font-weight="700" fill="#6E6E73" text-anchor="middle">MALWARE</text>
<text x="808" y="108" font-size="11.5" font-weight="700" fill="#6E6E73" text-anchor="middle">ADULT</text>
<line x1="24" y1="118" x2="876" y2="118" stroke="#1C1C1E" stroke-width="1.5"/>

<!-- row backgrounds -->
<rect x="24" y="118" width="852" height="46" fill="#FAFAFA"/>
<rect x="24" y="164" width="852" height="46" fill="#FFFFFF"/>
<rect x="24" y="210" width="852" height="46" fill="#FAFAFA"/>
<rect x="24" y="256" width="852" height="46" fill="#FFFFFF"/>
<rect x="24" y="302" width="852" height="46" fill="#FAFAFA"/>
<rect x="24" y="348" width="852" height="46" fill="#FFFFFF"/>
<rect x="24" y="394" width="852" height="46" fill="#FAFAFA"/>
<rect x="24" y="440" width="852" height="46" fill="#FFFFFF"/>
<rect x="24" y="486" width="852" height="46" fill="#FAFAFA"/>
<line x1="24" y1="532" x2="876" y2="532" stroke="#E5E5EA" stroke-width="1"/>

<!-- accent bar flagging the two Cloudflare rows -->
<rect x="24" y="348" width="4" height="92" fill="#2E5AAC"/>

<!-- Row 0: AdGuard DNS - Ad Blocking -->
