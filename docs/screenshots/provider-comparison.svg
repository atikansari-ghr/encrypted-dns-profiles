<circle cx="536" cy="141" r="8" fill="#2E5AAC"/>
<circle cx="672" cy="141" r="8" fill="none" stroke="#B0B4BA" stroke-width="2"/>
<circle cx="808" cy="141" r="8" fill="none" stroke="#B0B4BA" stroke-width="2"/>

